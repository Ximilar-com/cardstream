version: 2
updates:
  # The one that matters most: it is what keeps SHA-pinned actions current.
  # Dependabot rewrites both the SHA and the `# vX.Y.Z` comment beside it,
  # which is what makes pinning sustainable rather than a one-off gesture.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
