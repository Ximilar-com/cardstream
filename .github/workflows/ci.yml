name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy + lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; nothing here writes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --extra client --extra onnx --group dev
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      # The generated flag table must match the real parser.
      - run: uv run python scripts/gen-cli-docs.py --check
      # The lockfile must match pyproject; a stale lock is a silent drift.
      - run: uv lock --check

  test:
    name: pytest + node
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout only; nothing here writes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # opencv/onnxruntime wheels differ on arm64 macOS, and Windows is
          # where image_store.py's path handling would break first.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --extra client --extra onnx --group dev
      - name: pytest
        run: uv run pytest -q
      - name: node --test (the page's pure logic)
        run: node --test "tests/webui/*.test.js"

  build:
    name: wheel builds and renders
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; nothing here writes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      # Proves the PyPI page will render: readme, licence expression, urls.
      - run: uvx twine check dist/*
