# Runs with `pre-commit` or `prek` (the Rust reimplementation) — the config is
# the same either way. CI runs the same gates via `make check`, so this is a
# fast local echo, not a second source of truth.
#
#   pre-commit install     # once
#   pre-commit run -a      # everything, now
default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        # Model weights and capture videos do not belong in git — model/ is
        # gitignored for the same reason. This is the backstop for a path
        # the ignore rules miss.
        args: [--maxkb=512]

  - repo: https://github.com/crate-ci/typos
    rev: v1.42.0
    hooks:
      - id: typos

  # Workflow linting: catches the injection and over-broad-token classes that
  # matter most in a repo whose CI holds a PyPI publishing identity.
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.16.0
    hooks:
      - id: zizmor
